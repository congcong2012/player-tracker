plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.playertracker'

base {
    archivesName = 'playertracker-1.21.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

neoForge {
    version = '21.1.255'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        playertracker {
            sourceSet sourceSets.main
        }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : 'playertracker',
                'Specification-Vendor'  : 'playertracker',
                'Specification-Version' : '1',
                'Implementation-Title'  : 'Player Tracker Compass',
                'Implementation-Version': project.version
        ])
    }
}
