displayName="Player Tracker Compass"
authors="Player Tracker"
description='''玩家追踪指南针：复用原版指南针的材质与模型，右键玩家即可绑定追踪目标。

手持时指针指向目标并显示距离；目标离线、未绑定或身处其他维度时，HUD 会给出明确状态。

Player Tracker Compass: bind a player by right-clicking them, then hold the compass to see the needle point at them along with the distance. Offline, unbound and cross-dimension states are shown explicitly.'''

